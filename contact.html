<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="contact.css">
    <title>Contact</title>
</head>
<body>
    <h1 class="title">Contactgegevens</h1>
    <div class="main">
        <div class="grijze-blok">
            <h2 class="title" id="terug">Adres</h2>
            <div>Heyendaalseweg 98, 6525 EE Nijmegen</div>
        </div>
        <div class="grijze-blok">
            <h2 class="title" id="terug">Informatie</h2>
            <div>Roc-nijmegen@gmail.com</div>
            <div>024-890-45-00</div>
        </div>
        <div class="grijze-blok" >
            <h2 class="title">Media</h2>
            <div id="media" id="back">
                <img src="youtube.png" alt="">
                <img src="discord.png" alt="">
                <img src="twitch.png" alt="">
            </div>
        </div>
    </div>
    <div class="flex">
        <form>
         <label>Naam</label>
            <input type="text" name="naam" placeholder="Vul je naam in...">

            <label>E-mailadres</label>
            <input type="email" name="email" placeholder="Vul hier je email in...">

            <label>Bericht</label>
            <textarea name="bericht" placeholder="Typ hier je bericht..."></textarea>

            <button type="submit">Versturen</button>
        </form>
        <img class="img" src="hand-stand.png" alt="">
    </div>
</body>
</html>
